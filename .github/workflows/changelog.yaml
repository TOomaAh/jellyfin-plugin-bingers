name: '📝 Create/Update Release Draft'

# Keeps a draft release up to date with the merged pull requests (grouped by label, see .github/release-drafter.yml).
# Publishing the draft triggers the publish workflow.

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'TOomaAh/jellyfin-plugin-bingers' }}
    steps:
      - name: Update Draft
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
